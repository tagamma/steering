# Steering Default Configuration
# Version 1.0

version: 1.0

# Vendor-specific output files/directories
vendor_files:
  cursor: .cursor/rules                      # Directory for Cursor rule symlinks
  continue: .continue/rules                  # Directory for Continue.dev rule symlinks
  copilot: .github/copilot-instructions.md   # GitHub Copilot instructions
  antigravity: .agents/rules                 # steering-*.md pointer rules for agy (gitignore them)
  # claude writes no file: Claude Code (v2.1.277+) reads AGENTS.md natively

# Default vendor to use if not specified (legacy, use default_vendors instead)
default_vendor: all

# List of vendors to enable when --vendor=all or no vendor specified
# Available: cursor, claude, continue, copilot, antigravity, codex
# ("gemini" is a deprecated alias for antigravity: Google replaced Gemini CLI
# with Antigravity CLI, `agy`.)
# claude and codex require no generated files: both read AGENTS.md natively,
# and codex reads .agents/skills/ too (Claude Code gets skills via
# skills.vendor_destinations below). codex is a pure no-op; claude only warns
# about leftover CLAUDE.md files, which `steering cleanup-claude-md` removes
# after checking their content. Including them here makes support explicit.
#
# antigravity is opt-in: it writes .agents/rules/steering-*.md pointer rules
# (gitignore them) because agy only expands @[label](path) includes and only
# loads nested AGENTS.md from its cwd up. It also deletes stale GEMINI.md files.
# Add it below if you use agy.
default_vendors:
  - cursor
  - claude
  - codex

# Glob patterns for discovering rules
# All patterns are relative to the input directory
# NOTE: Using single * to only match top-level files, not subdirectories
# This allows atoms/ subdirectories to exist for @ references only
auto_rules_glob: "rules/auto-rules/*.mdc"
contextual_rules_glob: "rules/contextual-rules/*.mdc"

# Pattern for discovering skill definitions (SKILL.md files)
# Each skill lives in its own subdirectory; the directory name is the skill name
# Supports symlinked skill directories, so skills defined elsewhere can be
# linked in. Don't symlink only SKILL.md: Codex deliberately ignores individual
# manifest symlinks even though it follows the directory form.
skills_glob: "rules/skills/*/SKILL.md"

# Pattern for discovering local AGENTS files throughout the repository
# This searches from the output directory (repository root)
agents_glob: "**/AGENTS.{md,mdc}"

# How repo-wide scans (AGENTS discovery, cleanup of generated files) find files:
# - auto:       use git-tracked files when the output directory is inside a git
#               work tree; error otherwise (pass --no-git for a one-off scan)
# - git:        require a git work tree (error when there is none)
# - filesystem: recursively walk the directory tree (pruning ignored_directories,
#               never following directory symlinks). Use this for directories
#               that aren't git repositories, e.g. knowledge bases.
discovery: auto

# Directories to ignore during AGENTS file discovery.
# Entries match path components exactly (".git" does NOT match ".gitea"),
# support fnmatch globs ("result-*", "*.egg-info"), and multi-component
# entries ("private/hass/config/custom_components") match by path prefix.
ignored_directories:
  - .git
  - node_modules
  - .cursor
  - .continue
  - result
  - result-*
  - .direnv
  - __pycache__
  - "*.egg-info"
  # Don't discover rules in the steering project itself
  - rules

# Validation settings (used by `steering validate`).
validate:
  # Ceiling, in KB, for the always-on context: the root AGENTS.md and the
  # auto-rules, plus every file they @-reference transitively. This is what
  # every agent ingests no matter what it's working on, so it's worth keeping
  # bounded. validate always prints the measured size; set a number here (or
  # pass --max-context-kb) to fail when it's exceeded. Leave unset for
  # report-only.
  # max_always_context_kb: 64
  #
  # validate also fails when the root AGENTS.md doesn't @-reference every
  # auto-rule: that import is the only way an auto-rule reaches Claude Code.

# Vendor-specific settings
# Cursor: rule symlinks, ref-*.mdc (@refs), nested AGENTS.md → glob-scoped wrappers.
# Claude: nothing to configure; it reads AGENTS.md natively.
# Antigravity: @[label](path) pointer rules in .agents/rules/steering-*.md.
continue:
  # Symlink rules directly like Cursor
  use_symlinks: true
  # For AGENTS files, create special .md files with directory-scoped globs
  scope_agents_to_directory: true

copilot:
  # Repository-wide instructions from auto-rules
  copilot_instructions_from_auto: true
  # Path-specific instructions from contextual rules
  path_specific_from_contextual: true
  # AGENTS.md files are supported natively (no generation needed)
  native_agents_support: true

# Skills configuration.
# Skills always live at .agents/skills/<name> (the canonical "open agent
# skills standard" location). The source path is not configurable -- making
# it canonical means tools like Codex and Antigravity CLI find skills there
# without a vendor-specific destination. Each child may itself be a symlink to
# a complete skill directory; keep SKILL.md regular inside that target. For
# tools that don't read the canonical path, list a destination below
# and steering will symlink each skill into it.
skills:
  # Where to symlink skills for each vendor.
  # Remove a vendor entry to disable symlinking for that tool entirely.
  vendor_destinations:
    # https://code.claude.com/docs/en/skills
    claude: ".claude/skills"
    #
    # Cursor supports multiple skill directories and by default picks them
    # up from .claude/skills. Uncomment to override.
    # https://cursor.com/docs/context/skills#skill-directories
    # cursor: ".cursor/skills"
    #
    # Codex reads .agents/skills/ natively -- no destination needed.
    # https://developers.openai.com/codex/skills
    #
    # Antigravity CLI (agy) also reads .agents/skills/ natively (directory
    # symlinks included) -- no destination needed.
